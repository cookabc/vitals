name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Toolchain
        run: swift --version
      # xcodegen is small and the brew formula is stable, so caching the binary
      # avoids a 1-2 minute install on every run.
      - name: Cache xcodegen
        id: xcodegen-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/bin/xcodegen
          key: xcodegen-2.44.1
      - name: Install project generator
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          brew install xcodegen
          mkdir -p ~/.local/bin
          cp "$(command -v xcodegen)" ~/.local/bin/xcodegen
      - name: Generate project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          xcodegen generate
      - name: Lint formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests
      - name: Test
        run: xcodebuild test -project Vitals.xcodeproj -scheme Vitals -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/DerivedData
      - name: Package local app
        run: bash scripts/package-app.sh
