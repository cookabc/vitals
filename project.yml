name: Vitals
options:
  bundleIdPrefix: com.cookabc
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Vitals:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vitals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookabc.vitals
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/Vitals/Info.plist
      properties:
        CFBundleDisplayName: Vitals
        CFBundleName: Vitals
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
  VitalsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VitalsTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Vitals
  VitalsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/VitalsUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # VitalsUI 是可选的界面测试 scheme。运行时通过 xcodebuild 指定 DEVELOPMENT_TEAM
        # 和 CODE_SIGN_IDENTITY；团队 ID 应取自证书的 OU，而非证书名称末尾的成员 ID。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
    dependencies:
      - target: Vitals
schemes:
  Vitals:
    build:
      targets:
        Vitals: all
        VitalsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - VitalsTests
  VitalsUI:
    build:
      targets:
        Vitals: all
        VitalsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VitalsUITests
